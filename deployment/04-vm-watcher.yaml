# Live VM state lane: watches KubeVirt VirtualMachines and publishes each
# change to Kafka topic vm-events, keyed by namespace/name.
#
# Needs get/list/watch on virtualmachines in every watched namespace
# (01-rbac.yaml), or 01-rbac-cluster.yaml for WATCH_NAMESPACES="*".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-watcher
  namespace: vm-watcher
  labels:
    app: vm-watcher
spec:
  # One replica. A second one would publish every change twice; the consumer
  # absorbs that (fingerprint dedupe, resourceVersion order) but gains nothing.
  replicas: 1
  selector:
    matchLabels:
      app: vm-watcher
  template:
    metadata:
      labels:
        app: vm-watcher
    spec:
      serviceAccountName: vm-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watcher
          image: vm-watcher:dev
          imagePullPolicy: Never
          env:
            - name: WATCH_NAMESPACES
              value: "team-a,team-b"   # "*" or "all" for every namespace
            - name: KAFKA_BROKERS
              value: "vm-audit-cluster-kafka-bootstrap.vm-watcher.svc:9092"
            - name: KAFKA_TOPIC
              value: "vm-events"
            # Upper bound on events per Kafka write. A lone change is written at once.
            - name: BATCH_MAX_SIZE
              value: "100"
            - name: HTTP_ADDR
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
          # Ready once the informer caches have synced.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# /healthz, /readyz and /metrics. kind-config.yaml maps the NodePort to localhost:8080.
apiVersion: v1
kind: Service
metadata:
  name: vm-watcher
  namespace: vm-watcher
  labels:
    app: vm-watcher
spec:
  selector:
    app: vm-watcher
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
  type: NodePort

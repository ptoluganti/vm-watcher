# Live VM state lane: applies the watcher's changes from Kafka topic vm-events
# to PostgreSQL tables vm_state and vm_state_transitions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-event-consumer
  namespace: vm-watcher
  labels:
    app: vm-event-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vm-event-consumer
  template:
    metadata:
      labels:
        app: vm-event-consumer
    spec:
      serviceAccountName: vm-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: vm-event-consumer:dev
          imagePullPolicy: Never
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: dsn
            - name: KAFKA_BROKERS
              value: "vm-audit-cluster-kafka-bootstrap.vm-watcher.svc:9092"
            - name: KAFKA_TOPIC
              value: "vm-events"
            - name: KAFKA_GROUP_ID
              value: "vm-event-consumer"
            - name: KAFKA_MAX_WAIT
              value: "500ms"
            # Offsets are committed in the background at this interval ("0" = after
            # every batch, synchronously). Replays after a crash are deduplicated.
            - name: KAFKA_COMMIT_INTERVAL
              value: "1s"
            # Upper bound on messages applied per PostgreSQL transaction.
            - name: BATCH_MAX_SIZE
              value: "500"
            # Dedupe scope in consumer_processed_events.
            - name: CONSUMER_NAME
              value: "vm-event-consumer-1"
            - name: MAX_TRANSITION_GAP
              value: "30m"
            - name: HTTP_ADDR
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Exposes /metrics (consumer lag, end-to-end event lag, batch sizes) to Prometheus.
apiVersion: v1
kind: Service
metadata:
  name: vm-event-consumer
  namespace: vm-watcher
  labels:
    app: vm-event-consumer
spec:
  selector:
    app: vm-event-consumer
  ports:
    - name: http
      port: 8080
      targetPort: http
